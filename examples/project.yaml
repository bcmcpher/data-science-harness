# project.yaml — the project ledger (v1, Phase 1).
# The administrative source of truth: a project header, an append-only activity `log`, and the
# `products` / `obligations` registries. Validated against schemas/project.schema.json; conventions
# in docs/project-ledger.md. Validate with: python3 schemas/validate-ledger.py examples/project.yaml
#
# It is `datalad save`-d like any other file, so the administrative record is provenance-tracked
# alongside the science.

project:
  name: demo-study
  description: "Effect of X on outcome Y in cohort Z"
  created: 2026-07-10T14:30:00Z
  dataset_root: .
  stack: python

products:
  # Named deliverables grouped from kept comparisons (analyze/manage-product), released and
  # cross-linked by disseminate/*. Empty at new-project; populated as the story takes shape.
  - id: main-paper
    kind: paper
    title: "X reduces Y in cohort Z"
    status: in-progress
    comparisons: [cmp/group-diff-y]
    outputs: [derivatives/cmp-group-diff-y/]
    dois: []
    relations:
      - { relation: IsSupplementedBy, target: data-release }
    submissions:
      # A history, not a state: the product stays `in-progress` across both, and the resubmission
      # appends rather than overwriting the first venue's outcome.
      - { venue: "Journal of Cohort Studies", submitted: 2026-08-04, status: rejected,
          decision: "Reject after review — reviewers asked for a second cohort",
          ref: JCS-2026-0412 }
      - { venue: "Imaging Methods Reports", submitted: 2026-09-12, status: under-review,
          ref: IMR-2026-1187 }
  - id: data-release
    kind: dataset
    title: "Cohort Z curated BIDS dataset"
    status: planned
    comparisons: []
    outputs: [.]
    dois: []
    relations: []

obligations:
  # Manage & Comply commitments (govern/*). Resolved by flipping status, never by deletion — and a
  # status of `met` must name the recorded action that met it in `resolved_by`. `ref` is the
  # EXTERNAL reference; `resolved_by` is internal evidence a reader can check against this dataset.
  - id: prereg-h1
    kind: preregistration
    description: "Primary hypothesis (group difference in Y) frozen before data lock"
    due: 2026-09-01
    status: met
    ref: https://osf.io/xxxxx
    resolved_by: a1b2c3d   # the run-comparison commit that executed the registered spec

  - id: ethics-renewal
    kind: ethics
    description: "IRB protocol 2026-0417 expires; renewal submitted 60 days prior"
    due: 2027-06-30
    status: pending
    ref: IRB-2026-0417

  - id: ms-first-submission
    kind: milestone
    description: "Main paper submitted to a first venue"
    due: 2026-08-31
    status: met
    resolved_by: 2026-08-04T09:15:00Z   # the submission-track log entry below

contributors:
  # People + CRediT credit (project/people); mirrored to dataset_description.json Authors.
  - name: Ada Researcher
    orcid: https://orcid.org/0000-0002-1825-0097
    affiliation_ror: https://ror.org/00xxxxx
    roles: [Conceptualization, Formal analysis, Writing – original draft]

log:
  # Append-only. Each entry: { ts, op, stage, note, branch? }.
  # Never rewrite or reorder prior entries — corrections are new entries.
  - { ts: 2026-07-10T14:30:00Z, op: new-project, stage: initialize,
      note: "scaffolded YODA+BIDS dataset + container recipe", branch: main }

  - { ts: 2026-07-10T15:05:00Z, op: propose-comparison, stage: analyze,
      note: "cmp: group difference in outcome Y (exploratory quick query)", branch: cmp/group-diff-y }

  - { ts: 2026-07-10T15:40:00Z, op: run-comparison, stage: analyze,
      note: "container-run stats.py; recorded commit a1b2c3d; outputs derivatives/cmp-group-diff-y/",
      branch: cmp/group-diff-y }

  - { ts: 2026-07-10T16:00:00Z, op: checkpoint, stage: analyze,
      note: "datalad save end-of-session; decision log updated", branch: cmp/group-diff-y }

  - { ts: 2026-07-10T16:30:00Z, op: manage-product, stage: analyze,
      note: "grouped cmp/group-diff-y into product main-paper", branch: main }

  - { ts: 2026-07-11T10:00:00Z, op: ethics-track, stage: govern,
      note: "IRB protocol 2026-0417 approved 2026-07-01, expires 2027-06-30; renewal obligation
             recorded. Approval date and amendments live here, not in a structured field.",
      branch: main }

  - { ts: 2026-08-04T09:15:00Z, op: submission-track, stage: disseminate,
      note: "main-paper submitted to Journal of Cohort Studies (JCS-2026-0412)", branch: main }

  - { ts: 2026-09-05T11:20:00Z, op: submission-track, stage: disseminate,
      note: "JCS-2026-0412 rejected after review; milestone ms-first-submission already met by the
             2026-08-04 submission and is not reopened",
      branch: main }

  - { ts: 2026-09-12T08:40:00Z, op: submission-track, stage: disseminate,
      note: "main-paper resubmitted to Imaging Methods Reports (IMR-2026-1187); the JCS outcome
             stays in submissions[] rather than being replaced",
      branch: main }
