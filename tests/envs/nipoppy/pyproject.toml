# Live tool test environment: nipoppy.
#
# SCOPE: installs the real `nipoppy` so tests/e2e-smoke.sh can run the command lines its toolbox
# skill teaches against the tool itself. It is not a check dependency (see the root
# pyproject.toml) and not a harness dependency: a user installing plugins needs none of this.
#
#   bin/test-envs sync nipoppy     # uv sync --locked --project tests/envs/nipoppy
#
# The `==` pin is the version under test. A bump is `uv lock --project tests/envs/nipoppy
# --upgrade-package nipoppy` together with an edit to the pin, and re-runs the refinement loop.

[project]
name = "dsh-test-env-nipoppy"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["nipoppy==0.4.7"]

[tool.uv]
package = false
