# Live tool test environment: pynidm.
#
# SCOPE: installs the real `pynidm` so tests/e2e-smoke.sh can run the command lines its toolbox
# skill teaches against the tool itself. It is not a check dependency (see the root
# pyproject.toml) and not a harness dependency: a user installing plugins needs none of this.
#
#   bin/test-envs sync pynidm     # uv sync --locked --project tests/envs/pynidm
#
# The `==` pin is the version under test. A bump is `uv lock --project tests/envs/pynidm
# --upgrade-package pynidm` together with an edit to the pin, and re-runs the refinement loop.

[project]
name = "dsh-test-env-pynidm"
version = "0.0.0"
# pynidm declares >=3.8, but that floor makes uv resolve old prov 2.x releases with no `graph`
# extra for the 3.8-3.9 fork. 3.10 is the repository's own floor and leaves one resolution.
requires-python = ">=3.10"
dependencies = ["pynidm==4.5.5"]

[tool.uv]
package = false
